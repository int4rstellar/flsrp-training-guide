<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Florida State RP - Guide</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    button {
      background: #5865F2;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #4752C4;
    }
    #logout-btn {
      background: #2f2f2f;
      display: none;
      font-size: 13px;
      padding: 6px 12px;
    }
    #logout-btn:hover {
      background: #424242;
    }
    #protected-content {
      display: none;
      margin-top: 20px;
      text-align: left;
      background: #262626;
      padding: 20px;
      border-radius: 8px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <span id="user-badge" style="font-size: 14px; color: #aaa;"></span>
      <button id="logout-btn">Log Out</button>
    </div>

    <h1>Florida State RP</h1>
    <p id="status">Please log in with Discord to access the guide.</p>
    <button id="login-btn">Login with Discord</button>

    <!-- PUT YOUR PRIVATE GUIDE CONTENT INSIDE THIS DIV -->
    <div id="protected-content">
      <h2>Welcome to the Florida State RP Guide</h2>
      <p>Put your rules, SOPs, server links, or embedded guides right here.</p>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // 1. REPLACE THESE 4 VALUES WITH YOUR OWN:
    const SUPABASE_URL = 'https://nyrfvlyapwazukltdlsf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_cVOlR7exe7ZuoaLKr0aOKA_a6Vv1dU7';
    const GUILD_ID = '1428115068297412742';
    const ALLOWED_ROLE_ID = '1428115068389949549';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const statusText = document.getElementById('status');
    const userBadge = document.getElementById('user-badge');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const protectedBox = document.getElementById('protected-content');

    // Login
    loginBtn.onclick = async () => {
      await supabase.auth.signInWithOAuth({
        provider: 'discord',
        options: {
          scopes: 'guilds.members.read',
          redirectTo: window.location.origin + window.location.pathname
        }
      });
    };

    // Log Out
    logoutBtn.onclick = async () => {
      await supabase.auth.signOut();
      localStorage.clear();
      window.location.href = window.location.origin + window.location.pathname;
    };

    // Verify Session & Roles
    const { data: { session } } = await supabase.auth.getSession();

    if (session) {
      loginBtn.style.display = 'none';
      logoutBtn.style.display = 'inline-block';

      if (!session.provider_token) {
        // Token expired — force a fresh login
        await supabase.auth.signOut();
        localStorage.clear();
        loginBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        statusText.innerText = 'Your session expired. Please log in with Discord again.';
      } else {
        statusText.innerText = 'Verifying your Discord roles...';

        const res = await fetch(`https://discord.com/api/users/@me/guilds/${GUILD_ID}/member`, {
          headers: { Authorization: `Bearer ${session.provider_token}` }
        });

        if (res.ok) {
          const member = await res.json();
          const hasAccess = member.roles.some((roleId) => ALLOWED_ROLE_IDS.includes(roleId));

          if (hasAccess) {
            userBadge.innerText = `Logged in as ${member.user?.username || 'Member'}`;
            statusText.style.display = 'none';
            protectedBox.style.display = 'block';
          } else {
            statusText.innerText = 'Access Denied: You do not have any of the required Discord roles.';
          }
        } else {
          statusText.innerText = 'Access Denied: You must be in the Florida State RP Discord server.';
        }
      }
    }
  </script>
</body>
</html>
